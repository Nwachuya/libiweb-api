events {}

http {
    upstream api {
        server api:3000;
    }

    upstream fused {
        server fused:8001;
    }

    server {
        listen 80;

        # Computational endpoints → fused backend (path rewrite /v2/ → /v1/)
        location ~* ^/v2/(chrono|mock|fuzzy|token|pack|diff|cast|tax|policy|telemetry|series|spatial|proration|apca|dag|enforcer|gcode|bio|merkle|aeo|shifts)(/.*)?$ {
            rewrite ^/v2/(.*)$ /v1/$1 break;
            proxy_pass http://fused;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Everything else → Node.js API
        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }
}
