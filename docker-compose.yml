services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - fused
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - PORT=3000
    expose:
      - "3000"
    restart: unless-stopped

  fused:
    build:
      context: ./apimink/fused-backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - PORT=8001
    expose:
      - "8001"
    restart: unless-stopped
